name: Build Linux Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build Linux packages
        run: npx electron-builder --linux deb AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/*.deb
            release/*.AppImage

  publish-apt:
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: release

      - name: Setup GPG
        if: env.GPG_KEY != ''
        run: |
          echo "$GPG_KEY" | gpg --batch --import
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Create APT repository
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev

          mkdir -p apt-repo/pool/main
          mkdir -p apt-repo/dists/stable/main/binary-amd64
          mkdir -p apt-repo/dists/stable/main/binary-arm64

          # Copy debs
          cp release/*.deb apt-repo/pool/main/ 2>/dev/null || true

          cd apt-repo

          # Generate Packages files
          dpkg-scanpackages --multiversion pool/ /dev/null > dists/stable/main/binary-amd64/Packages
          cp dists/stable/main/binary-amd64/Packages dists/stable/main/binary-arm64/Packages
          gzip -k -f dists/stable/main/binary-amd64/Packages
          gzip -k -f dists/stable/main/binary-arm64/Packages

          # Generate Release
          cd dists/stable
          cat > Release << EOF
          Origin: CHRONO
          Label: CHRONO
          Suite: stable
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: CHRONO Task Manager APT Repository
          EOF
          apt-ftparchive release . >> Release

          # Sign if key available
          if [ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            gpg --batch --yes --armor --detach-sign --output Release.gpg Release
            gpg --batch --yes --armor --detach-sign --output InRelease --clearsign Release
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          publish_branch: apt-repo
          keep_files: true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.AppImage
          generate_release_notes: true
