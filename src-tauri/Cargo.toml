[workspace]
members = ["chrono-core"]
resolver = "2"

[package]
name = "chrono"
version = "4.0.0"
description = "CHRONO — premium dark-green glassmorphism task manager"
authors = ["CHRONO"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "chrono_lib"
crate-type = ["rlib"]

[features]
# Production builds must serve the frontend from the embedded assets instead of
# the dev server. `tauri build` enables this automatically.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono-core = { path = "chrono-core" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
open = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
